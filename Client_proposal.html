<div class="page-container"><iframe srcdoc="<!DOCTYPE html> <html lang=&quot;en&quot;> <head>   <meta charset=&quot;UTF-8&quot;>   <title>Proposal Overview</title>   <link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;>   <link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin>   <link href=&quot;https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap&quot; rel=&quot;stylesheet&quot;>   <style>     * { margin: 0; padding: 0; box-sizing: border-box; }      :root {       --cream:      #F9F3F1;       --teal-dark:  #1C4243;       --teal-mid:   #254A4B;       --teal-light: #7CA7AB;       --rule:       #CFD6CF;       --num-dim:    #CFD6CF;       --header-dim: #649798;     }      html, body {       width: 1920px;       height: 1080px;       overflow: hidden;       background: #F9F3F1;     }      .slide {       width: 1920px;       height: 1080px;       position: relative;       font-family: 'Geist', sans-serif;       background: #F9F3F1;       overflow: hidden;     }      /* ── Teal blob — top-right, mix-blend-mode:multiply (matches Figma SVG) ── */     /* ── Teal blob — top-right, mix-blend-mode:multiply (matches Figma SVG) ── */     .blob {       position: absolute;       top: -1800px;       right: -2200px;       width: 2827px;       height: 2287px;       border-radius: 50%;       background: #81A2A5;       transform: rotate(168.68deg);       filter: blur(257px);       pointer-events: none;     }      /* ── Header bar ── */     .header {       position: absolute;       top: 0; left: 0; right: 0;       height: 68px;       display: flex;       align-items: center;       padding: 0 54px;       mix-blend-mode: multiply;     }     /* Each span gets its own opacity so mix-blend does the right thing */     .header-left, .header-mid, .header-right {       font-size: 22px;       letter-spacing: 0.01em;       color: #649798;       opacity: 0.5;     }     .header-mid  { flex: 1; text-align: center; }      /* ── Page title ── */     /* Figma: flat #1C4243 with a vertical gradient overlay: transparent→#8CABAB top→bottom */     .page-title {       position: absolute;       top: 88px;       left: 51px;       font-size: 99.9px;       font-weight: 500;       letter-spacing: -0.04em;       line-height: 1;       color: #1C4243;     }     /* Gradient overlay layer on the title — matches paint0_linear (transparent → #8CABAB) */     .page-title::after {       content: attr(data-text);       position: absolute;       left: 0; top: 0;       background: linear-gradient(170deg, #8CABAB00 25%, #8CABAB 100%);       -webkit-background-clip: text;       background-clip: text;       color: transparent;       pointer-events: none;     }      /* ── Two-column TOC ── */     .toc {       position: absolute;       top: 305px;       left: 0;       right: 0;       bottom: 0;       display: grid;       grid-template-columns: 913px 835px;       column-gap: 57px;       padding: 0 55px 0 55px;     }      /* ── Column ── */     .col {       display: flex;       flex-direction: column;     }      /*     ══════════════════════════════════════════════════════     ROW STRUCTURE — how to add / remove / edit:      Each row is a <div class=&quot;row&quot;> (or &quot;row highlighted&quot;).     Inside: <span class=&quot;num&quot;>NN</span> + <span class=&quot;title&quot;>Text</span>      TO ADD A ROW:    copy any <div class=&quot;row&quot;>…</div> block and paste it     TO REMOVE A ROW: delete the <div class=&quot;row&quot;>…</div> block     TO HIGHLIGHT:    add class &quot;highlighted&quot; → <div class=&quot;row highlighted&quot;>     TO EDIT TEXT:    change the text inside <span class=&quot;num&quot;> or <span class=&quot;title&quot;>      Numbers are NOT auto-incremented — edit them manually if you add/remove rows.     The layout reflows automatically when you add/remove rows.     ══════════════════════════════════════════════════════     */      .row {       display: flex;       align-items: baseline;       gap: 0;       padding: 21px 0 20px;       border-top: 1px solid var(--rule);       position: relative;       flex-shrink: 0;     }     /* last row in each column gets a bottom border too */     .col .row:last-child {       border-bottom: 1px solid var(--rule);     }      .num {       font-size: 22px;       font-weight: 500;       letter-spacing: -0.03em;       color: var(--num-dim);       width: 44px;       flex-shrink: 0;       line-height: 1;       padding-top: 6px;     }     .title {       font-size: 36px;       font-weight: 500;       letter-spacing: -0.03em;       color: var(--teal-mid);       line-height: 1.1;       flex: 1;     }      /* Arrow — right-aligned, shown only on highlighted rows */     .arrow {       display: none;       align-items: center;       color: var(--teal-light);       flex-shrink: 0;       padding-left: 12px;     }     .arrow svg { width: 32px; height: 22px; }      /* Highlighted row */     .row.highlighted .num   { color: var(--teal-light); }     .row.highlighted .title { color: var(--teal-light); font-weight: 600; }     .row.highlighted .arrow { display: flex; }      /* ── Print / PDF ── */     @media print {       @page { size: 1920px 1080px; margin: 0; }       html, body {         width: 1920px; height: 1080px;         -webkit-print-color-adjust: exact;         print-color-adjust: exact;       }     }   </style> </head> <body> <div class=&quot;slide&quot;>    <div class=&quot;blob&quot;></div>    <!-- ── Header ── -->   <!-- EDITABLE: breadcrumb left, section name center, page number right -->   <header class=&quot;header&quot;>     <span id=&quot;header-left&quot; class=&quot;header-left&quot;>SHITTEST / MULTI-GEO PAYMENT QA TESTING PROPOSAL</span>     <span id=&quot;header-right&quot; class=&quot;header-mid&quot;>PROPOSAL OVERVIEW</span>     <span id=&quot;page-number&quot; class=&quot;header-right&quot;>02</span>   </header>    <!-- ── Page title ── -->   <!-- EDITABLE: page title -->   <h1 id=&quot;main-title&qu
